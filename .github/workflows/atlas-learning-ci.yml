name: Atlas Learning CI

on:
  push:
  pull_request:

# Pinned Atlas commit for reproducible E2E — update when Atlas PR advances.
env:
  ATLAS_CLI_PIN_SHA: "6af69f379b294caa2bdace9f340a6c019ebfe976"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Prisma 7 ships an ungenerated client after npm ci. Generate it before any
      # unit test imports the persistence layer, just as the clean build job does.
      - run: npx prisma generate
      # The release gate requires zero lint errors, but nothing enforced it here, so two
      # errors sat on the product line unnoticed. Running it in CI is what keeps that gate real.
      - run: npm run lint
      - run: npm run test
      - run: npm run test:tasks
      - run: npm run test:interpreter-contract
      - run: npm run test:session
      - run: npm run test:attempt-trust
      - name: Crystal economy
        env:
          DATABASE_URL: "file:./ci-crystals.db"
          # Runtime prisma adapter reads TURSO_DATABASE_URL (falls back to file:./dev.db).
          TURSO_DATABASE_URL: "file:./ci-crystals.db"
        run: |
          npx prisma generate
          npx prisma db push --url "$DATABASE_URL"
          npm run test:crystals
      # Live literalness (0 repairs) when a chat key is present in repo secrets.
      # Without keys the suite SKIPs; set INTERPRETER_LIVE_REQUIRED=1 once secrets exist.
      - name: Interpreter literalness
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          INTERPRETER_REPEATS: "3"
        run: npm run test:interpreter

  # Builds from a clean checkout with no env vars, so anything that only works
  # because it is installed or present on a developer machine fails here rather
  # than on a production deploy.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run build

  # 08-UX-MONSTER-JOURNEY §7 step 6, non-negotiable precondition: the CURRENT /session
  # route must be driven in a real browser in CI before UX v1.1 may be turned on. Until
  # this job existed, CI ran unit tests and a build only, and `verify:release` drove the
  # legacy /lesson route — which is how a broken retry button once shipped green.
  # The suite starts its own Next dev server and SQLite fixture and forces
  # NEXT_PUBLIC_UX_V11=1, so it certifies the screen a child actually meets.
  current-session-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium firefox webkit
      # Public by design — this exact value ships to every browser — so it is a repository
      # variable, not a secret. Without it ClerkProvider throws during render and the
      # suite exits BLOCKED with instructions rather than pretending to have certified
      # anything. Set it at Settings → Secrets and variables → Actions → Variables.
      # Exit 2 is BLOCKED — the suite could not boot the app, so it certified nothing.
      # That is a configuration gap, not a broken product, and the two must not look the
      # same: a red job for a missing variable trains everyone to ignore a red job. It
      # surfaces as a warning annotation and a job-summary line instead, and it never
      # reads as a pass. Any other non-zero code is a real failure and still fails here.
      - name: Current session UI browser gate
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          set +e
          npm run test:e2e:current-sessions
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning title=Browser gate did not run::NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is not set as a repository variable, so the app could not boot and nothing was certified."
            {
              echo "### current-session-ui: BLOCKED, not run"
              echo ""
              echo "The app cannot render without a Clerk publishable key, so this gate certified nothing."
              echo "This is **not** a pass. Set \`NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY\` under"
              echo "Settings → Secrets and variables → Actions → **Variables** to turn it on."
              echo "It is public by design — the same value ships to every browser."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit $code
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-session-ui-evidence
          path: .superpowers/sdd/evidence/
          if-no-files-found: warn

  atlas-learning-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VOLAURA
        uses: actions/checkout@v4

      - name: Checkout Atlas
        uses: actions/checkout@v4
        with:
          repository: ganbaroff/atlas-cli
          path: atlas-cli
          ref: ${{ env.ATLAS_CLI_PIN_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Atlas learning API
        working-directory: atlas-cli
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Start Atlas learning API
        working-directory: atlas-cli
        env:
          ATLAS_LEARNING_API_KEY: ci-test-key
          ATLAS_LEARNING_STATE_DIR: /tmp/atlas-learning-volaura-ci
          PORT: "8089"
        run: |
          node dist/learning-api.js &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8089/health && exit 0
            sleep 0.5
          done
          echo "Atlas learning API failed to start" >&2
          exit 1

      - name: Install VOLAURA deps
        run: npm ci

      - name: Sigmoid E2E over HTTP
        env:
          ATLAS_LEARNING_API_URL: http://127.0.0.1:8089
          ATLAS_LEARNING_API_KEY: ci-test-key
          TURSO_DATABASE_URL: "file:./ci-atlas-e2e.db"
          DATABASE_URL: "file:./ci-atlas-e2e.db"
        run: npm run test:atlas-learning
